spring:
  application:
    name: fixhome-backend
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fixhome_db}
    username: ${DB_USERNAME:fixhome}
    password: ${DB_PASSWORD:fixhome}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

fixhome:
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

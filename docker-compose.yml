services:
  postgres:
    image: postgres:15-alpine
    container_name: fixhome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixhome_db
      POSTGRES_USER: fixhome
      POSTGRES_PASSWORD: fixhome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fixhome-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
